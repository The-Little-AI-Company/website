name: CI

# Checks every pull request, and every push to dev (the merge that deploy.yml publishes).
# A push to any other branch is checked when its pull request is, not twice.
on:
  pull_request:
  push:
    branches: [dev]

# Read-only: CI never publishes anything.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These old/fixed versions are intentional guard fixtures, never site build runtimes.
  node-policy-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - node: '22.23.3'
            expected-exit: 1
          - node: '22.23.4'
            expected-exit: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up the fixture runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check the executable despite a spoofed version
        shell: bash
        env:
          NODE_VERSION: '22.23.4'
        run: |
          set +e
          node scripts/check-node-version.mjs 22.23.4
          actual=$?
          set -e
          if [ "$actual" -ne "${{ matrix.expected-exit }}" ]; then
            echo "Node ${{ matrix.node }} returned $actual. Expected ${{ matrix.expected-exit }}."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    # A hung browser or install should not hold a runner for the six hour default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # pnpm's version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - name: Check the Node runtime
        run: node scripts/check-node-version.mjs
      - name: Test the Node version policy
        run: node --test scripts/check-node-version.test.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check, hints included
        run: pnpm check
      - name: Build the site
        run: pnpm build
        env:
          # The build asks GitHub for Callout's latest release. A token keeps shared runners from being rate limited.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Unit tests
        run: pnpm test
      # @playwright/test is pinned to the version whose Chromium this installs.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      # The HTML report, and the trace of each failed test, so a failure on a runner can be opened and looked at.
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
