# pnpm 11 reads build-script approvals here. Only these known, audited
# Astro deps may run install/build scripts (esbuild = bundler, sharp = images).
allowBuilds:
  esbuild: true
  sharp: true

# Force a patched yaml (GHSA-48c2-rrv3-qjmp) through @astrojs/check's chain.
overrides:
  yaml: '^2.8.3'
  # Security updates stay on each existing dependency's release line.
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'nanoid@>=3.0.0 <3.3.18': '3.3.18'
  'postcss@>=8.0.0 <8.5.23': '8.5.23'
  'svgo@>=4.0.0 <4.1.0': '4.1.0'
  'smol-toml@>=1.0.0 <=1.8.0': '1.9.0'
  'devalue@>=5.0.0 <5.9.3': '5.9.3'
  'http-cache-semantics@>=4.0.0 <=4.2.0': '4.3.0'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'vite@>=8.0.0 <8.1.6': '8.1.6'
